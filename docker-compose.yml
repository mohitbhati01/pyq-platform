version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pyq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyq_user
      POSTGRES_PASSWORD: pyq_password
      POSTGRES_DB: pyq_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # L-5 fix: Health check prevents NestJS from starting before DB is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyq_user -d pyq_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pyq_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    # L-5 fix: Health check for Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: pyq_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # L-5 fix: Health check for Elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  es_data:
